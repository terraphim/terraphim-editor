<link rel="stylesheet" href="terraphim-editor.min.css">
<script src="terraphim-editor.min.js"></script>

<div id="editor-container"></div>

<script>
  const editor = new TeraphimEditor(document.getElementById('editor-container'), {
    // Optional custom config overrides
    styles: {
      editorHeight: '500px',
      defaultSplitPosition: 40
    }
  });
  
  editor.initialize().then(() => {
    console.log('Editor initialized');
  });
</script>
