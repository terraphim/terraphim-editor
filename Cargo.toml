[package]
name = "terraphim-editor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.89"
web-sys = { version = "0.3.66", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlDivElement",
    "DomTokenList",
    "InputEvent",
    "Node",
    "Window",
    "Text",
    "Performance",
    "console"
] }
console_error_panic_hook = "0.1.7"
markdown = "1.0.0-alpha.21"
rinja = { version = "0.3.5" }
js-sys = "0.3.66"
serde_json = "1"
thiserror = "2"
terraphim_alternatives = { path = "crates/terraphim_alternatives" }
terraphim_lab = { path = "crates/terraphim_lab" }
# KG alternatives (issue #13): the pure terraphim_lsp core, pinned to an exact
# released version from the private registry (no sibling path).
terraphim_lsp_core = { version = "=1.21.3", registry = "terraphim" }

[dev-dependencies]
wasm-bindgen-test = "0.3.39"
wasm-bindgen-futures = "0.4"

# criterion pulls in rayon, which does not compile for wasm32; native benches only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "markdown_bench"
harness = false

[[bench]]
name = "document_bench"
harness = false

[[bench]]
name = "kg_bench"
harness = false

[workspace]
members = [".", "crates/terraphim_alternatives", "crates/terraphim_lab"]
resolver = "2"
# terraphim_lsp_core depends on terraphim_alternatives 0.1 from the registry.
# Point that dependency at the workspace member (the published 0.1.0 is built
# from it) so the build has exactly one copy of the span model and a/an rules.
[patch.terraphim]
terraphim_alternatives = { path = "crates/terraphim_alternatives" }
