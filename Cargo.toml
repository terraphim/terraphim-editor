[package]
name = "terraphim-editor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.89"
web-sys = { version = "0.3.66", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlDivElement",
    "DomTokenList",
    "InputEvent",
    "Node",
    "Window",
    "Text",
    "Performance",
    "console"
] }
console_error_panic_hook = "0.1.7"
markdown = "1.0.0-alpha.21"
rinja = { version = "0.3.5" }
js-sys = "0.3.66"
serde_json = "1"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12"
thiserror = "2"
terraphim_alternatives = { version = "0.1.1", path = "crates/terraphim_alternatives" }
terraphim_lab = { version = "0.1.1", path = "crates/terraphim_lab" }
# Pure KG analysis shared with the language server, from crates.io.
terraphim_lsp_core = "=1.23.1"

[dev-dependencies]
terraphim_rolegraph_browser = { path = "crates/terraphim_rolegraph_browser" }
wasm-bindgen-test = "0.3.39"
wasm-bindgen-futures = "0.4"

# criterion pulls in rayon, which does not compile for wasm32; native benches only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "markdown_bench"
harness = false

[[bench]]
name = "document_bench"
harness = false

[[bench]]
name = "kg_bench"
harness = false

[workspace]
members = [".", "crates/terraphim_alternatives", "crates/terraphim_lab", "crates/terraphim_rolegraph_browser"]
resolver = "2"
# Keep the language server core and browser on the same workspace span
# model and Lab engine. Published dependants resolve these versions on crates.io.
[patch.crates-io]
terraphim_alternatives = { version = "0.1.1", path = "crates/terraphim_alternatives" }
terraphim_lab = { version = "0.1.1", path = "crates/terraphim_lab" }
