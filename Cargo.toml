[package]
name = "terraphim-editor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.89"
web-sys = { version = "0.3.66", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlDivElement",
    "InputEvent",
    "Node",
    "Window",
    "Text"
] }
console_error_panic_hook = "0.1.7"
markdown = "1.0.0-alpha.21"
rinja = { version = "0.3.5" } 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"