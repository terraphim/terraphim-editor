[package]
name = "terraphim-editor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.89"
web-sys = { version = "0.3.66", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlDivElement",
    "InputEvent",
    "Node",
    "Window",
    "Text",
    "Performance",
    "console"
] }
console_error_panic_hook = "0.1.7"
markdown = "1.0.0-alpha.21"
rinja = { version = "0.3.5" }
js-sys = "0.3.66"
serde_json = "1"
terraphim_alternatives = { path = "crates/terraphim_alternatives" }

[dev-dependencies]
wasm-bindgen-test = "0.3.39"
wasm-bindgen-futures = "0.4"

# criterion pulls in rayon, which does not compile for wasm32; native benches only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "markdown_bench"
harness = false

[[bench]]
name = "document_bench"
harness = false

[workspace]
members = [".", "crates/terraphim_alternatives"]
resolver = "2"