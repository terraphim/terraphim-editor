[package]
name = "lab-heuristics"
version = "0.1.0"
edition = "2021"
publish = false
description = "Research prototype for issue #3: deterministic weakest-sentence ranking and trim selection"
license = "MIT"

# Empty workspace table: this crate is deliberately NOT a member of the
# terraphim-editor workspace. Build it with
#   cargo run --manifest-path research/lab-heuristics/Cargo.toml
[workspace]

[dependencies]
# KG matching (Aho-Corasick LeftmostLongest, ASCII case-insensitive,
# word-boundary filtered) and KG markdown parsing are delegated to
# terraphim_automata 1.22 from the private Terraphim registry (configured in
# ~/.cargo/config.toml as `terraphim`, sparse index on git.terraphim.cloud).
# Default features build for both native and wasm32-unknown-unknown.
terraphim_automata = { version = "1.22", registry = "terraphim" }
serde_json = "1"
