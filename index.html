    <link data-trunk rel="css" href="public/css/tokens.css" />

    <!-- <script data-trunk src="public/js/alert.js"></script> -->
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        #app {
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .markdown-input {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
            padding: 1rem;
            resize: none;
            font-family: monospace;
            outline: none;
        }

        .markdown-preview {
            height: 100%;
            padding: 1rem;
            overflow-y: auto;
        }

        .command-palette::part(base) {
            --sl-focus-ring: none;
            background: var(--sl-color-neutral-0);
            border: 1px solid var(--sl-color-neutral-200);
            border-radius: var(--sl-border-radius-medium);
            box-shadow: var(--sl-shadow-large);
        }

        .command-palette::part(panel) {
            width: 300px;
            outline: none;
            background: var(--sl-color-neutral-0);
            padding: 0.5rem;
        }

        .command-search {
            margin-bottom: 1rem;
            width: 100%;
            background: var(--sl-color-neutral-0);
        }

        .command-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 0.5rem;
            scroll-behavior: smooth;
            user-select: none;
            outline: none;
            background: var(--sl-color-neutral-0);
        }

        .command-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            cursor: pointer;
            border-radius: var(--sl-border-radius-medium);
            background: transparent;
            transition: background-color 0.2s ease;
        }

        .command-item:hover {
            background: var(--sl-color-neutral-100);
        }

        .command-item.selected {
            background: var(--sl-color-primary-100);
        }

        .command-list:focus {
            box-shadow: none;
        }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
