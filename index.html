<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Markdown Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.12.0/cdn/themes/light.css" />
    <script type="module">
      import { setBasePath } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.12.0/cdn/utilities/base-path.js';
      setBasePath('https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.12.0/cdn/');
    </script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.12.0/cdn/components/split-panel/split-panel.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        #app {
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        sl-split-panel {
            height: calc(100vh - 40px);
            border: 1px solid var(--sl-color-neutral-200);
            border-radius: var(--sl-border-radius-medium);
            --divider-width: 2px;
        }

        .markdown-input {
            width: 100%;
            height: 100%;
            padding: 1rem;
            border: none;
            resize: none;
            font-family: var(--sl-font-mono);
            font-size: var(--sl-font-size-medium);
            background: none;
            outline: none;
            box-sizing: border-box;
        }

        .markdown-preview {
            width: 100%;
            height: 100%;
            padding: 1rem;
            overflow-y: auto;
            background: var(--sl-color-neutral-50);
            box-sizing: border-box;
        }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
