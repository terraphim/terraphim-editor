name: Editor release publication contract
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/editor-release-contracts.yml'
      - 'scripts/publish-editor-release.py'
      - 'scripts/check-release-source.py'
      - 'scripts/check-public-dependencies.py'
      - 'scripts/check-release-readiness.py'
      - 'scripts/ci/release-node/**'
      - 'tests/test_editor_release.py'
      - 'tests/browser/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/editor-release-contracts.yml'
      - 'scripts/publish-editor-release.py'
      - 'scripts/check-release-source.py'
      - 'scripts/check-public-dependencies.py'
      - 'scripts/check-release-readiness.py'
      - 'scripts/ci/release-node/**'
      - 'tests/test_editor_release.py'
      - 'tests/browser/**'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify real Git, archive, saved-output and immutable release boundaries
        run: python3 -m unittest discover -s tests -p 'test_editor_release.py' -v
