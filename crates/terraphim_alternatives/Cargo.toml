[package]
name = "terraphim_alternatives"
version = "0.1.1"
edition = "2024"
description = "Span model for non-KG alternative-control state: human alternatives, ghosting, overflow and the trailing annotation block."
license = "MIT"
repository = "https://github.com/terraphim/terraphim-editor"
readme = "README.md"
keywords = ["markdown", "alternatives", "editor"]
# Shared by the browser editor and language server.
publish = ["crates-io"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terraphim_automata = { version = "2.1.0" }
terraphim_types = { version = "1.22.3" }
thiserror = "2"
unicode-segmentation = "=1.13.3"

# criterion pulls in rayon, which does not compile for wasm32; native benches only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "alternatives_bench"
harness = false
