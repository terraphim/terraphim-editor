[package]
name = "terraphim_alternatives"
version = "0.1.0"
edition = "2024"
description = "Span model for non-KG alternative-control state: human alternatives, ghosting, overflow and the trailing annotation block."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terraphim_automata = { version = "2.0", registry = "terraphim" }
terraphim_types = { version = "1.22", registry = "terraphim" }
thiserror = "2"

# criterion pulls in rayon, which does not compile for wasm32; native benches only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "alternatives_bench"
harness = false
