<div class="editor-container">
  <div class="split-panel">
    <div class="split-panel-start">
      <div class="toolbar">
        <div class="button-group" id="formatting-toolbar">
          <!-- Buttons will be inserted dynamically -->
        </div>
        <div class="divider-vertical"></div>
        <div class="button-group">
          <button class="btn btn-sm" id="show-help" title="Help">
            <span class="icon">?</span>
          </button>
        </div>
      </div>
      <textarea class="markdown-input" placeholder="Enter markdown here...">{{ initial_content }}</textarea>
    </div>
    <div class="split-panel-divider" id="panel-divider"></div>
    <div class="split-panel-end">
      <div class="markdown-preview">{{ initial_preview|safe }}</div>
    </div>
  </div>
</div>

<div class="dialog shortcuts-dialog" id="shortcuts-dialog">
  <div class="dialog-overlay"></div>
  <div class="dialog-content">
    <div class="dialog-header">
      <h3>Markdown Shortcuts</h3>
      <button class="dialog-close" id="close-help">&times;</button>
    </div>
    <div class="divider"></div>
    <div class="dialog-body" id="shortcuts-list">
      <!-- Shortcuts will be inserted dynamically -->
    </div>
  </div>
</div>
