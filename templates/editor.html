<div class="editor-container">
  <sl-split-panel position="50">
    <div slot="start">
      <div class="toolbar">
        <sl-button-group label="Formatting">
          {% for shortcut in shortcuts %}
          <sl-tooltip content="{{ shortcut.key }}">
            <sl-button size="small" 
                      data-key="{{ shortcut.key }}" 
                      data-prefix="{{ shortcut.prefix }}" 
                      data-suffix="{{ shortcut.suffix }}"
                      variant="default">
              <sl-icon name="{{ shortcut.name }}"></sl-icon>
            </sl-button>
          </sl-tooltip>
          {% endfor %}
        </sl-button-group>
        <sl-divider vertical></sl-divider>
        <sl-button-group label="Help">
          <sl-button size="small" id="show-help">
            <sl-icon name="question-circle"></sl-icon>
          </sl-button>
        </sl-button-group>
      </div>
      <textarea class="markdown-input" placeholder="Enter markdown here...">{{ initial_content }}</textarea>
    </div>
    <div slot="end">
      <div class="markdown-preview">{{ initial_preview|safe }}</div>
    </div>
  </sl-split-panel>
</div>

<sl-dialog label="Markdown Shortcuts" class="shortcuts-dialog">
  <sl-divider></sl-divider>
  {% for shortcut in shortcuts %}
  <div class="shortcut-item">
    <sl-icon name="{{ shortcut.name }}"></sl-icon>
    <span class="shortcut-desc">{{ shortcut.desc }}</span>
    <sl-badge variant="neutral">{{ shortcut.key }}</sl-badge>
  </div>
  {% endfor %}
</sl-dialog>

<script type="module">
  function wrapSelectedText(textarea, prefix, suffix) {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const text = textarea.value;
    const before = text.substring(0, start);
    const selection = text.substring(start, end);
    const after = text.substring(end);
    
    const wrappedText = selection ? selection : 'text';
    textarea.value = before + prefix + wrappedText + suffix + after;
    
    // Set cursor position
    const newCursorPos = selection ? 
      start + prefix.length + selection.length + suffix.length :
      start + prefix.length + 4; // 4 is length of 'text'
    
    textarea.focus();
    textarea.selectionStart = selection ? start + prefix.length : start + prefix.length;
    textarea.selectionEnd = selection ? end + prefix.length : start + prefix.length + 4;
    
    textarea.dispatchEvent(new Event('input'));
  }

  const textarea = document.querySelector('.markdown-input');
  const shortcuts = Array.from(document.querySelectorAll('sl-button[data-key]'))
    .map(btn => ({
      key: btn.dataset.key,
      prefix: btn.dataset.prefix,
      suffix: btn.dataset.suffix,
      element: btn
    }));

  // Setup keyboard shortcuts
  textarea.addEventListener('keydown', (e) => {
    const key = `${e.ctrlKey ? 'ctrl+' : ''}${e.key.toLowerCase()}`;
    const shortcut = shortcuts.find(s => s.key === key);
    
    if (shortcut) {
      e.preventDefault();
      wrapSelectedText(textarea, shortcut.prefix, shortcut.suffix);
    }
  });

  // Setup toolbar buttons
  shortcuts.forEach(shortcut => {
    shortcut.element.addEventListener('click', () => {
      wrapSelectedText(textarea, shortcut.prefix, shortcut.suffix);
    });
  });

  // Setup help dialog
  const dialog = document.querySelector('.shortcuts-dialog');
  const helpButton = document.querySelector('#show-help');
  helpButton.addEventListener('click', () => dialog.show());
</script>

<style>
  .toolbar {
    display: flex;
    gap: 1rem;
    padding: 0.5rem;
    background: var(--sl-color-neutral-50);
    border-bottom: 1px solid var(--sl-color-neutral-200);
  }

  .shortcut-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.5rem 0;
  }

  .shortcut-desc {
    flex: 1;
  }

  sl-divider {
    margin: 0.5rem 0;
  }
</style>
