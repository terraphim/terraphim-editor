<div class="editor-container">
  <sl-split-panel position="50">
    <div slot="start">
      <div class="toolbar">
        <sl-button-group label="Formatting" id="formatting-toolbar">
          <!-- Buttons will be inserted dynamically -->
        </sl-button-group>
        <sl-divider vertical></sl-divider>
        <sl-button-group label="Help">
          <sl-button size="small" id="show-help">
            <sl-icon name="question-circle"></sl-icon>
          </sl-button>
        </sl-button-group>
      </div>
      <textarea class="markdown-input" placeholder="Enter markdown here...">{{ initial_content }}</textarea>
    </div>
    <div slot="end">
      <div class="markdown-preview">{{ initial_preview|safe }}</div>
    </div>
  </sl-split-panel>
</div>

<sl-dialog label="Markdown Shortcuts" class="shortcuts-dialog">
  <sl-divider></sl-divider>
  <div id="shortcuts-list">
    <!-- Shortcuts will be inserted dynamically -->
  </div>
</sl-dialog>
