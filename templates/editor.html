<div class="editor-container">
  <sl-split-panel position="50">
    <div slot="start">
      <div class="toolbar">
        <sl-button-group label="Formatting" id="formatting-toolbar">
          <!-- Buttons will be inserted dynamically -->
        </sl-button-group>
        <sl-divider vertical></sl-divider>
        <sl-button-group label="Help">
          <sl-button size="small" id="show-help">
            <sl-icon name="question-circle"></sl-icon>
          </sl-button>
        </sl-button-group>
      </div>
      <div class="markdown-input te-surface" contenteditable="plaintext-only" role="textbox" aria-multiline="true" aria-label="Markdown source" aria-placeholder="Enter markdown here..." data-placeholder="Enter markdown here..." spellcheck="false">{{ initial_content }}</div>
    </div>
    <div slot="end">
      <div class="markdown-preview">{{ initial_preview|safe }}</div>
    </div>
  </sl-split-panel>
</div>

<sl-dialog label="Markdown Shortcuts" class="shortcuts-dialog">
  <sl-divider></sl-divider>
  <div id="shortcuts-list">
    <!-- Shortcuts will be inserted dynamically -->
  </div>
</sl-dialog>

<style>
  .toolbar {
    display: flex;
    gap: 1rem;
    padding: 0.5rem;
    background: var(--sl-color-neutral-50);
    border-bottom: 1px solid var(--sl-color-neutral-200);
  }

  .shortcut-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.5rem 0;
  }

  .shortcut-desc {
    flex: 1;
  }

  sl-divider {
    margin: 0.5rem 0;
  }

  /* Structural rules for the contenteditable editing surface: newlines are
     literal characters in text nodes, so whitespace must be preserved. */
  .markdown-input {
    box-sizing: border-box;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    overflow-y: auto;
    contain: layout paint;
  }

  .markdown-input:empty::before {
    content: attr(data-placeholder);
    opacity: 0.5;
    pointer-events: none;
  }
</style>
