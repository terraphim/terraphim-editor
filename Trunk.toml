[build]
target = "index.html"
# Development output. The committed release copy in ./dist is regenerated only
# by scripts/release-dist.sh (trunk build --release --dist dist).
dist = "target/trunk-dist"

[serve]
address = "127.0.0.1"
port = 8080

# post_build: the embeddable bundle copies the hashed wasm-bindgen output to
# fixed names, so it must run after the Rust pipeline has written it (a
# `build` hook runs alongside the asset pipelines).
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "bash scripts/build-dist.sh"]

# Add proper MIME types
[serve.static_file_headers]
"**/*.js" = { "Content-Type" = "application/javascript" }
"**/*.css" = { "Content-Type" = "text/css" }